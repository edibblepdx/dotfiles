# unify colors
set-option -sa terminal-overrides ",xterm*:Tc"

# emacs mode
set -g mode-keys emacs
set -g status-keys emacs

# enable mouse
set -g mouse on

# <prefix>
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

#rebind split panes
bind [ split-window -h
bind ] split-window -v
unbind '"'
unbind %

# Vim style pane selection
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Use Alt-arrow keys without prefix to switch panes
bind -n C-Left select-pane -L
bind -n C-Right select-pane -R
bind -n C-Up select-pane -U
bind -n C-Down select-pane -D

# Use Ctrl-Shift-arrow keys without prefix to resize panes
bind -n C-S-Left resize-pane -L 1
bind -n C-S-Right resize-pane -R 1
bind -n C-S-Up resize-pane -U 1
bind -n C-S-Down resize-pane -D 1

# Use Alt-arrow to switch windows
bind -n M-Left  previous-window
bind -n M-Right next-window

# plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
#set -g @plugin 'christoomey/vim-tmux-navigator'

set -g @plugin 'vaaleyard/tmux-dotbar'
set -g @tmux-dotbar-bg "#1e1e2e"
set -g @tmux-dotbar-fg "#585b70"
set -g @tmux-dotbar-fg-current "#cdd6f4"
set -g @tmux-dotbar-fg-session "#9399b2"
set -g @tmux-dotbar-fg-prefix "#cba6f7"
set -g @tmux-dotbar-right true
set -g @tmux-dotbar-rounded true

# colors
#set -g @plugin 'catppuccin/tmux'
#set -g @plugin 'dreamsofcode-io/catppuccin-tmux'
#set -g @plugin 'egel/tmux-gruvbox'

# gruvbox: 'dark',  'light', 'dark-transparent', 'light-transparent'
#set -g @tmux-gruvbox 'dark' 
# catpuccin: 'latte', 'frappe', 'macchiato', 'mocha'
#set -g @catppuccin_flavour 'mocha'
set -g status-position bottom

# initialize tmux plugin manager (keep at bottom)
run '~/.tmux/plugins/tpm/tpm'

# set vi-mode
set-window-option -g mode-keys vi
# keybindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

